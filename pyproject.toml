[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverai"
version = "1.0.0"
description = "Bounded Autonomous Revenue Recovery Agent"
authors = [{name = "Aditya Abburi"}]
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
